<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar UniShare</title>
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-title-key="configureUniShare">
  <main class="options">
    <header class="brand-header">
      <img class="brand-logo" src="icons/icon-32.png" width="36" height="36" alt="">
      <div class="brand-titles">
        <span class="brand-eyebrow">UniShare</span>
        <h1 data-i18n="connectUniShare">Conectar con UniShare</h1>
      </div>
    </header>
    <section class="panel-card">
      <p class="section-lead" data-i18n="connectionHelp">Abre UniShare en Windows y copia los datos desde Opciones y herramientas → Conectar teléfono. Allí verás el puerto y la clave privada por separado.</p>
      <div class="form-grid">
        <div>
          <label for="port" data-i18n="localPort">Puerto local</label>
          <input id="port" type="number" min="1024" max="65535" value="47831">
        </div>
        <div>
          <label for="uiLanguage" data-i18n="language">Idioma</label>
          <select id="uiLanguage"><option value="es">Español</option><option value="en">English</option></select>
        </div>
      </div>
      <label for="pairingKey" data-i18n="privateKey">Clave privada</label>
      <input id="pairingKey" type="password" autocomplete="off">
      <button id="save" data-i18n="saveSettings">Guardar configuración</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel-card update-card">
      <div class="card-heading">
        <span class="icon-badge" aria-hidden="true">↻</span>
        <div>
          <h2 data-i18n="appUpdates">Actualizar extensión</h2>
          <p id="extensionVersion" class="meta-line"></p>
        </div>
      </div>
      <p id="extensionChannel" class="meta-pill"></p>
      <p id="updateStatus" role="status" aria-live="polite"></p>
      <button id="checkUpdate" class="secondary-btn" data-i18n="checkUpdate">Buscar actualización</button>
      <button id="applyUpdate" data-i18n="applyUpdate" hidden>Aplicar actualización del navegador</button>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="updates.js"></script>
  <script src="options.js"></script>
</body>
</html>
